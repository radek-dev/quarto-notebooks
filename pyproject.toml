[project]
name = "quarto-notebooks"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter-core>=5.9.1",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "tabulate>=0.10.0",
    "typst>=0.15.0",
]

[dependency-groups]
dev = [
    "quarto-cli>=1.10.19",
]
